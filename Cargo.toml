[package]
name = "geek-cli"
version = "0.1.2"
edition = "2021"
description = "Unified CLI for the Yangtze University Geek Class GitHub orgs — agent-friendly"
repository = "https://github.com/Yangtze-University-Geek-Class/geek-cli"
readme = "README.md"
keywords = ["github", "cli", "agent", "yzgc"]
categories = ["command-line-utilities"]

[lib]
name = "geek_cli"
path = "src/lib.rs"

[[bin]]
name = "geek"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
crossterm = "0.28"
url = "2"
base64 = "0.22"
urlencoding = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,        ext: ""     }
          - { os: macos-latest,   target: x86_64-apple-darwin,         ext: ""     }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,    ext: ""     }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,   ext: ""     }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,   ext: ""     }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile deps (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/geek${{ matrix.ext }}"
          out="dist/geek-${{ matrix.target }}${{ matrix.ext }}"
          cp "$bin" "$out"
          (cd dist && sha256sum "geek-${{ matrix.target }}${{ matrix.ext }}" > "geek-${{ matrix.target }}${{ matrix.ext }}.sha256" || shasum -a 256 "geek-${{ matrix.target }}${{ matrix.ext }}" > "geek-${{ matrix.target }}${{ matrix.ext }}.sha256")

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/geek-${{ matrix.target }}${{ matrix.ext }}
            dist/geek-${{ matrix.target }}${{ matrix.ext }}.sha256

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: geek-${{ matrix.target }}
          path: dist/

  publish-npm:
    name: publish npm wrapper
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          cd npm
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version='$tag'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm publish --access public
